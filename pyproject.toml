[project]
name = "linkedin-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for LinkedIn — publish posts, upload media, comment, react, and manage company pages from any MCP client (Amazon Quick, Amazon Q, Claude, Cline, Continue)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "linkedin-mcp-server contributors" }]
keywords = ["linkedin", "mcp", "model-context-protocol", "amazon-quick", "amazon-q", "claude"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
